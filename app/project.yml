name: Day
options:
  bundleIdPrefix: io.github.spashii
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    # tools/build.sh and tools/release.sh set these from VERSION and the commit count.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Google OAuth client (iOS type, no secret), without its .apps.googleusercontent.com
    # suffix. The placeholder keeps both apps on the invented fixture until a client exists;
    # the real value goes here and nowhere else.
    DAY_GOOGLE_CLIENT_ID: 894112264378-4hp182p15qf9k0o9k8ohe3j1l6dcqusa
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
packages:
  # Model, Google client, sync and every rule; shared with the widget and day-cli.
  DayCore:
    path: ../Core
  # Updates: checks the appcast on the website and installs signed releases.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  # Day for macOS: a regular app with a Dock icon, unsandboxed, released with Developer ID.
  # Embeds the desktop widget and shares one App Group with it. The group's identifier
  # carries the Team ID, which the Developer ID signature itself authorises; the app's
  # keychain group and iCloud store need a Developer ID provisioning profile (see its
  # entitlements), the widget none.
  DayMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      # Invented events for previews, screenshots and running without a Google client.
      - path: ../Core/Tests/DayCoreTests/Fixtures/invented-week.json
        buildPhase: resources
      # The icon and the privacy manifest, picked up once they exist. Globs rather than
      # paths, because XcodeGen adds a missing path anyway and the build then fails.
      - path: .
        includes: ["AppIcon.icon", "PrivacyInfo.xcprivacy"]
        buildPhase: resources
      # Shipped inside the app, as the licenses of the included libraries require.
      - path: ..
        includes: ["LICENSE", "THIRD_PARTY_NOTICES.md"]
        buildPhase: resources
    info:
      path: Mac/Info.plist
      properties:
        CFBundleName: Day
        CFBundleDisplayName: Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Free software under the MIT License.
        GoogleClientID: $(DAY_GOOGLE_CLIENT_ID).apps.googleusercontent.com
        # apps.idea2prod.in serves site/appcast.xml and counts the checks by app, version and
        # country. SUEnableSystemProfiling is never set, so a check carries no system profile.
        # The updater delegate adds self=1 to the request on the author's own Macs
        # (Mac/UpdaterDelegate.swift), so the count can leave them out.
        SUFeedURL: https://apps.idea2prod.in/day/appcast.xml
        # Updates must be signed with the matching private key, kept with the Developer ID.
        SUPublicEDKey: YLvPSGEaYiPsXphy/q9LCDGs2s0qp8hM2LVBIWbl78c=
        # day:// for clicks on the desktop widget, which open Day on a day.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.spashii.day
            CFBundleURLSchemes:
              - day
    # The app stays unsandboxed. It copies the widget snapshot into the App Group
    # (Mac/WidgetSnapshotWriter.swift); its cache stays in Application Support. The keychain
    # group holds each Google account's synced sign-in, the same string as on iPhone so both
    # read one set of items (app/Shared/Model/KeychainTokenStore.swift); the key-value store
    # holds the calendar settings, again one identifier for both platforms. macOS kills an
    # app that claims either without a provisioning profile granting it, so Release needs a
    # Developer ID profile with both, and Debug, signed without one, claims no entitlements:
    # it keeps tokens in the login keychain and settings on the Mac, as before.
    entitlements:
      path: Mac/Day.entitlements
      properties:
        com.apple.security.application-groups:
          - JMCP69LCSU.io.github.spashii.day
        keychain-access-groups:
          - JMCP69LCSU.io.github.spashii.day.shared
        com.apple.developer.ubiquity-kvstore-identifier: JMCP69LCSU.io.github.spashii.day
        # Background pushes from Day's relay (push/README.md). Production, the value a
        # Developer ID profile grants, so that profile needs Push Notifications too. Debug
        # claims no entitlements and gets no pushes; the timers keep it current.
        com.apple.developer.aps-environment: production
    settings:
      base:
        PRODUCT_NAME: Day
        PRODUCT_MODULE_NAME: DayMac
        PRODUCT_BUNDLE_IDENTIFIER: io.github.spashii.day
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad hoc ("Sign to Run Locally") unless tools/build.sh passes the "Blend Dev"
        # identity or tools/release.sh the Developer ID. The hardened runtime is on so a
        # Release build can be notarized.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Library validation under the hardened runtime refuses Sparkle, and the previews
        # library, when the app is signed with a certificate that has no team, like "Blend
        # Dev". Debug runs without it; Release, signed with the Developer ID, keeps it.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
          # See the entitlements above; Xcode also refuses to build them without a profile.
          # The App Group goes too, which a build without a Team ID never opens anyway
          # (MacWidgetGroup.isAvailable). Conditional, because XcodeGen sets the plain key
          # from `entitlements` in every configuration.
          "CODE_SIGN_ENTITLEMENTS[config=Debug]": ""
        # Xcode otherwise adds the debugger entitlement to every build, and notarization
        # rejects an app that carries it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # tools/release.sh sets DAY_MAC_PROFILE_NAME to the Developer ID provisioning
          # profile that grants the keychain group, the key-value store and push, and
          # DAY_MAC_ENTITLEMENTS to Mac/DayNoProfile.entitlements when there is none, so a
          # build without the profile still builds. Both are build settings of this target
          # alone: given on the command line, PROVISIONING_PROFILE_SPECIFIER would reach the
          # widget too.
          "CODE_SIGN_ENTITLEMENTS[config=Release]": "$(DAY_MAC_ENTITLEMENTS:default=Mac/Day.entitlements)"
          PROVISIONING_PROFILE_SPECIFIER: "$(DAY_MAC_PROFILE_NAME)"
    dependencies:
      - package: DayCore
        product: DayCore
      - package: Sparkle
      - sdk: ServiceManagement.framework
      - target: DayMacWidget

  # Day for iPhone. Shares app/Shared with the Mac and embeds the Lock Screen widget; the
  # App Group carries the widget snapshot and the old per-device keychain items.
  DayPhone:
    type: application
    platform: iOS
    sources:
      - path: iPhone
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
      - path: ../Core/Tests/DayCoreTests/Fixtures/invented-week.json
        buildPhase: resources
      - path: .
        includes: ["AppIcon.icon", "PrivacyInfo.xcprivacy"]
        buildPhase: resources
    info:
      path: iPhone/Info.plist
      properties:
        CFBundleDisplayName: Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSHumanReadableCopyright: Free software under the MIT License.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GoogleClientID: $(DAY_GOOGLE_CLIENT_ID).apps.googleusercontent.com
        # day:// for widget taps; the reversed client ID for Google's sign-in redirect.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.spashii.day
            CFBundleURLSchemes:
              - day
              - com.googleusercontent.apps.$(DAY_GOOGLE_CLIENT_ID)
        UIBackgroundModes:
          - fetch
          # The relay's background push runs a sync (iPhone/AppDelegate.swift).
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.spashii.day.refresh
        # Documents shows in Files, so a TestFlight build can share its latency log
        # (Shared/Model/PushLatency.swift). It holds no titles or IDs.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    # The keychain group and the key-value store are the Mac app's strings too, so a sign-in
    # and a calendar setting made on one reach the other.
    entitlements:
      path: iPhone/Day.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.spashii.day
        keychain-access-groups:
          - JMCP69LCSU.io.github.spashii.day.shared
        com.apple.developer.ubiquity-kvstore-identifier: JMCP69LCSU.io.github.spashii.day
        # Development in every configuration: Xcode signs every iPhone build, archives too,
        # with a development profile and refuses another value, and the export for App
        # Store Connect re-signs TestFlight builds with production.
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Day
        PRODUCT_MODULE_NAME: DayPhone
        PRODUCT_BUNDLE_IDENTIFIER: io.github.spashii.day
        TARGETED_DEVICE_FAMILY: "1"
        # The Mac has its own app; the iPhone build stays off Apple silicon Macs and Vision Pro.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JMCP69LCSU
    dependencies:
      - package: DayCore
        product: DayCore
      - target: DayWidget
      - sdk: WidgetKit.framework

  # The Lock Screen widget "Next". Same App Group as the app and no Data Protection
  # entitlement, which would hide the widget whenever the phone is locked.
  DayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: ["Info.plist", "*.entitlements"]
      # Stage two refreshes tokens from the shared keychain itself.
      - path: Shared/Model
        includes: ["KeychainTokenStore.swift"]
      # Realistic invented data for the widget gallery.
      - path: ../Core/Tests/DayCoreTests/Fixtures/invented-week.json
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoogleClientID: $(DAY_GOOGLE_CLIENT_ID).apps.googleusercontent.com
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # The app's keychain group, for the synced sign-ins it refreshes with. No key-value store:
    # the widget reads the settings from the files the app writes.
    entitlements:
      path: Widget/DayWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.spashii.day
        keychain-access-groups:
          - JMCP69LCSU.io.github.spashii.day.shared
        # WidgetKit pushes reach the widget only with this on the extension itself; the
        # value follows the app's.
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: DayWidget
        PRODUCT_BUNDLE_IDENTIFIER: io.github.spashii.day.widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JMCP69LCSU
    dependencies:
      - package: DayCore
        product: DayCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # The desktop widget "Today", embedded in DayMac. A Mac extension must be sandboxed; it
  # reads only the snapshot the app copies into the shared App Group, holds no tokens and
  # never goes online. Signed like the app: ad hoc or "Blend Dev" in Debug, the Developer ID
  # in Release, which is what authorises the Team ID group.
  DayMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: MacWidget
        excludes: ["Info.plist", "*.entitlements"]
      # The group's identifier and folder, one definition for the app and the widget.
      - path: Mac
        includes: ["WidgetSnapshotWriter.swift"]
      # Event colors as the Day list draws them.
      - path: Shared/Model
        includes: ["Colors.swift"]
      # The invented week for the gallery and for running without a Google client.
      - path: Widget
        includes: ["NextDemo.swift"]
      - path: ../Core/Tests/DayCoreTests/Fixtures/invented-week.json
        buildPhase: resources
    info:
      path: MacWidget/Info.plist
      properties:
        CFBundleDisplayName: Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "26.0"
        GoogleClientID: $(DAY_GOOGLE_CLIENT_ID).apps.googleusercontent.com
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MacWidget/DayMacWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - JMCP69LCSU.io.github.spashii.day
    settings:
      base:
        PRODUCT_NAME: DayMacWidget
        PRODUCT_BUNDLE_IDENTIFIER: io.github.spashii.day.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
      # The same split as DayMac: no hardened runtime in Debug, where a certificate without
      # a team fails library validation, and no debugger entitlement in Release, which
      # notarization refuses in any nested code.
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: DayCore
        product: DayCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  DayMac:
    build:
      targets:
        DayMac: all
    run:
      config: Debug
      commandLineArguments:
        "-UseFixtures invented-week": false
        "-Now 2026-11-04T12:10": false
    archive:
      config: Release
  DayPhone:
    build:
      targets:
        DayPhone: all
        DayWidget: all
    run:
      config: Debug
      commandLineArguments:
        "-UseFixtures invented-week": false
        "-Now 2026-11-04T12:10": false
    archive:
      config: Release
